<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Under Maintenance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:    '#0A0F14',
          ink2:   '#111820',
          ink3:   '#1B232D',
          line:   '#28323D',
          paper:  '#F3F1EA',
          paper2: '#FFFFFF',
          sand:   '#E7E3D8',
          signal: '#3ED9A6',
          signal2:'#2BB98B',
          warn:   '#FF7A45',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          display: ['"Space Grotesk"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        boxShadow: {
          glow: '0 0 0 1px rgba(62,217,166,0.25), 0 8px 30px -8px rgba(62,217,166,0.35)',
        }
      }
    }
  }
</script>

<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; }
  .font-num { font-family: 'JetBrains Mono', monospace; }
  ::selection { background: #3ED9A6; color: #0A0F14; }
</style>
</head>

<body class="bg-paper dark:bg-ink text-ink dark:text-paper transition-colors duration-300 antialiased flex flex-col justify-between min-h-screen">

<!-- ============ HEADER ============ -->
<header class="w-full border-b border-black/5 dark:border-white/5 bg-paper/80 dark:bg-ink/70 backdrop-blur-lg">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 h-16 md:h-20 flex items-center justify-between">

    <!-- logo -->
    <a href="#" class="flex items-center gap-2.5">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="14" stroke="#3ED9A6" stroke-width="1.5" opacity="0.35"/>
        <path d="M4 15H10L12.5 8L17 22L19.5 15H26" stroke="#3ED9A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-display font-bold text-lg tracking-tight">Pulse<span class="text-signal">.</span></span>
    </a>

    <!-- theme toggle -->
    <button id="themeToggle" aria-label="Toggle dark / light mode"
      class="w-10 h-10 rounded-full border border-black/10 dark:border-white/10 flex items-center justify-center hover:border-signal/60 transition-colors">
      <svg id="iconSun" class="hidden w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg id="iconMoon" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ============ MAIN CONTENT ============ -->
<main class="flex-grow flex items-center justify-center px-5 py-12 relative overflow-hidden">
  <div class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-signal/15 blur-[120px]"></div>

  <div class="max-w-xl text-center relative z-10 border border-black/10 dark:border-white/10 rounded-3xl p-8 sm:p-12 bg-paper2/50 dark:bg-ink2/50 backdrop-blur-md">
    
    <div class="inline-flex items-center gap-2 border border-black/10 dark:border-white/10 rounded-full px-4 py-1.5 text-xs font-num text-ink/60 dark:text-paper/60 mb-6">
      <span class="w-2 h-2 rounded-full bg-warn animate-ping"></span>
      Temporary Maintenance
    </div>

    <h1 class="font-display font-black text-8xl sm:text-9xl text-signal tracking-widest font-num select-none mb-2">
      404
    </h1>

    <h2 class="font-display font-bold text-2xl sm:text-3xl mb-4">
      Under Maintenance
    </h2>

    <p class="text-ink/60 dark:text-paper/60 text-sm sm:text-base leading-relaxed mb-8">
      We are currently performing scheduled maintenance to improve our site. We’ll be back online shortly!
    </p>

    <a href="https://wa.me/212600000000" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-signal text-ink font-bold px-7 py-3.5 rounded-full hover:bg-signal2 transition-colors shadow-glow text-sm">
      Contact Us on WhatsApp
    </a>
  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer class="border-t border-black/5 dark:border-white/5 py-6 text-center text-xs text-ink/40 dark:text-paper/40 font-num">
  © <span id="year"></span> Pulse. All rights reserved.
</footer>

<script>
  // ---- theme toggle ----
  const html = document.documentElement;
  const sun = document.getElementById('iconSun');
  const moon = document.getElementById('iconMoon');
  
  function syncIcons(){
    const isDark = html.classList.contains('dark');
    sun.classList.toggle('hidden', !isDark);
    moon.classList.toggle('hidden', isDark);
  }
  
  const saved = localStorage.getItem('theme');
  if (saved === 'light') html.classList.remove('dark');
  syncIcons();
  
  document.getElementById('themeToggle').addEventListener('click', () => {
    html.classList.toggle('dark');
    localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    syncIcons();
  });

  // current year
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
